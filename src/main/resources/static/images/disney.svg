<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#1E3A8A"/>

  <!-- Stars -->
  <circle cx="30" cy="30" r="2" fill="#FCD34D"/>
  <circle cx="170" cy="40" r="2" fill="#FCD34D"/>
  <circle cx="50" cy="60" r="1.5" fill="#FCD34D"/>
  <circle cx="150" cy="70" r="1.5" fill="#FCD34D"/>
  <circle cx="180" cy="90" r="2" fill="#FCD34D"/>
  <circle cx="20" cy="100" r="1.5" fill="#FCD34D"/>
  <circle cx="160" cy="120" r="1" fill="#FCD34D"/>
  <circle cx="40" cy="140" r="1" fill="#FCD34D"/>

  <!-- Castle silhouette -->
  <g fill="#3B82F6">
    <!-- Main tower -->
    <rect x="85" y="80" width="30" height="80"/>
    <polygon points="100,60 85,80 115,80"/>
    <rect x="95" y="65" width="10" height="15" fill="#FCD34D"/>

    <!-- Left tower -->
    <rect x="60" y="100" width="20" height="60"/>
    <polygon points="70,85 60,100 80,100"/>
    <rect x="67" y="90" width="6" height="10" fill="#FCD34D"/>

    <!-- Right tower -->
    <rect x="120" y="100" width="20" height="60"/>
    <polygon points="130,85 120,100 140,100"/>
    <rect x="127" y="90" width="6" height="10" fill="#FCD34D"/>

    <!-- Small left turret -->
    <rect x="40" y="120" width="15" height="40"/>
    <polygon points="47.5,110 40,120 55,120"/>

    <!-- Small right turret -->
    <rect x="145" y="120" width="15" height="40"/>
    <polygon points="152.5,110 145,120 160,120"/>
  </g>

  <!-- Windows -->
  <rect x="67" y="110" width="6" height="8" fill="#FCD34D"/>
  <rect x="127" y="110" width="6" height="8" fill="#FCD34D"/>
  <rect x="95" y="90" width="10" height="12" fill="#FCD34D"/>
  <rect x="67" y="130" width="6" height="8" fill="#FCD34D"/>
  <rect x="127" y="130" width="6" height="8" fill="#FCD34D"/>

  <!-- Door -->
  <rect x="92" y="140" width="16" height="20" fill="#FCD34D" rx="8" ry="0"/>

  <!-- Flags -->
  <line x1="100" y1="60" x2="100" y2="45" stroke="#DC2626" stroke-width="1"/>
  <polygon points="100,45 108,48 100,51" fill="#DC2626"/>

  <line x1="70" y1="85" x2="70" y2="72" stroke="#DC2626" stroke-width="0.8"/>
  <polygon points="70,72 76,74 70,76" fill="#DC2626"/>

  <line x1="130" y1="85" x2="130" y2="72" stroke="#DC2626" stroke-width="0.8"/>
  <polygon points="130,72 136,74 130,76" fill="#DC2626"/>

  <!-- Shooting star -->
  <line x1="140" y1="50" x2="155" y2="60" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
  <circle cx="155" cy="60" r="3" fill="#FCD34D"/>

  <!-- Text -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FBBF24" text-anchor="middle">DISNEY</text>
</svg>

