<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#303f9f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd54f;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffb74d;stop-opacity:0.3" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#skyGrad)"/>

  <!-- Sun/divine light -->
  <circle cx="100" cy="60" r="35" fill="url(#lightGrad)"/>
  <circle cx="100" cy="60" r="28" fill="#ffeb3b" opacity="0.6"/>

  <!-- Greek column (left) -->
  <rect x="35" y="100" width="15" height="70" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="32" y="95" width="21" height="8" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
  <rect x="32" y="167" width="21" height="6" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
  <line x1="37" y1="103" x2="37" y2="165" stroke="#b0bec5" stroke-width="1"/>
  <line x1="42.5" y1="103" x2="42.5" y2="165" stroke="#b0bec5" stroke-width="1"/>
  <line x1="48" y1="103" x2="48" y2="165" stroke="#b0bec5" stroke-width="1"/>

  <!-- Greek column (right) -->
  <rect x="150" y="100" width="15" height="70" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="147" y="95" width="21" height="8" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
  <rect x="147" y="167" width="21" height="6" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
  <line x1="152" y1="103" x2="152" y2="165" stroke="#b0bec5" stroke-width="1"/>
  <line x1="157.5" y1="103" x2="157.5" y2="165" stroke="#b0bec5" stroke-width="1"/>
  <line x1="163" y1="103" x2="163" y2="165" stroke="#b0bec5" stroke-width="1"/>

  <!-- Lightning bolt (Zeus symbol) -->
  <path d="M 100 85 L 95 100 L 102 100 L 97 115 L 108 100 L 101 100 Z"
        fill="#ffeb3b" stroke="#ffc107" stroke-width="1.5"/>

  <!-- Trident (Poseidon symbol) -->
  <g transform="translate(70, 130)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#90caf9" stroke-width="2"/>
    <line x1="-5" y1="0" x2="-5" y2="15" stroke="#90caf9" stroke-width="2"/>
    <line x1="5" y1="0" x2="5" y2="15" stroke="#90caf9" stroke-width="2"/>
    <circle cx="-5" cy="15" r="1.5" fill="#64b5f6"/>
    <circle cx="0" cy="0" r="1.5" fill="#64b5f6"/>
    <circle cx="5" cy="15" r="1.5" fill="#64b5f6"/>
  </g>

  <!-- Owl (Athena symbol) -->
  <g transform="translate(130, 130)">
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="8" ry="12" fill="#bcaaa4"/>
    <!-- Head -->
    <circle cx="0" cy="-5" r="7" fill="#8d6e63"/>
    <!-- Eyes -->
    <circle cx="-3" cy="-5" r="2.5" fill="#fff"/>
    <circle cx="3" cy="-5" r="2.5" fill="#fff"/>
    <circle cx="-3" cy="-5" r="1.2" fill="#000"/>
    <circle cx="3" cy="-5" r="1.2" fill="#000"/>
    <!-- Beak -->
    <path d="M 0,-3 L -1.5,0 L 1.5,0 Z" fill="#ff6f00"/>
    <!-- Wings -->
    <ellipse cx="-7" cy="5" rx="3" ry="8" fill="#a1887f"/>
    <ellipse cx="7" cy="5" rx="3" ry="8" fill="#a1887f"/>
  </g>

  <!-- Laurel wreath at bottom -->
  <g transform="translate(100, 185)">
    <path d="M -25,0 Q -20,-5 -15,-3 Q -10,-1 -5,-4 Q 0,-6 5,-4 Q 10,-1 15,-3 Q 20,-5 25,0"
          fill="none" stroke="#7cb342" stroke-width="2"/>
    <!-- Leaves -->
    <ellipse cx="-20" cy="-2" rx="3" ry="5" fill="#8bc34a" transform="rotate(-30 -20 -2)"/>
    <ellipse cx="-10" cy="-2" rx="3" ry="5" fill="#8bc34a" transform="rotate(-15 -10 -2)"/>
    <ellipse cx="0" cy="-5" rx="3" ry="5" fill="#8bc34a"/>
    <ellipse cx="10" cy="-2" rx="3" ry="5" fill="#8bc34a" transform="rotate(15 10 -2)"/>
    <ellipse cx="20" cy="-2" rx="3" ry="5" fill="#8bc34a" transform="rotate(30 20 -2)"/>
  </g>

  <!-- Stars for divine atmosphere -->
  <circle cx="30" cy="30" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="170" cy="25" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="180" cy="45" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="20" cy="50" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="165" cy="70" r="1" fill="#fff" opacity="0.8"/>
</svg>

