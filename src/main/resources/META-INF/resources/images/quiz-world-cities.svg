<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="titleWC">
  <title id="titleWC">World Cities Latitudes Quiz</title>
  <rect width="128" height="128" rx="16" fill="#ecfdf5"/>
  <circle cx="64" cy="64" r="40" fill="#0891b2" stroke="#0e7490" stroke-width="3"/>

  <!-- Lignes de latitude -->
  <ellipse cx="64" cy="64" rx="40" ry="8" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <ellipse cx="64" cy="64" rx="40" ry="20" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <line x1="24" y1="64" x2="104" y2="64" stroke="#fff" stroke-width="2.5" opacity="0.8"/>

  <!-- Méridiens -->
  <ellipse cx="64" cy="64" rx="8" ry="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <ellipse cx="64" cy="64" rx="20" ry="40" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <line x1="64" y1="24" x2="64" y2="104" stroke="#fff" stroke-width="2.5" opacity="0.8"/>

  <!-- Points de villes -->
  <circle cx="50" cy="48" r="3" fill="#fbbf24"/>
  <circle cx="78" cy="56" r="3" fill="#fbbf24"/>
  <circle cx="64" cy="76" r="3" fill="#fbbf24"/>
  <circle cx="72" cy="42" r="3" fill="#fbbf24"/>
</svg>

