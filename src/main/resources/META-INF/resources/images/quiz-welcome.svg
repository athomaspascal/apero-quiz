<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.1)"/>
  <circle cx="350" cy="250" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="380" cy="30" r="20" fill="rgba(255,255,255,0.15)"/>
  <circle cx="20" cy="280" r="25" fill="rgba(255,255,255,0.1)"/>

  <!-- Question mark cards -->
  <!-- Card 1 (left) -->
  <g transform="translate(60, 80) rotate(-15)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="40" y="70" font-size="50" font-weight="bold" fill="#667eea" text-anchor="middle">?</text>
  </g>

  <!-- Card 2 (center) -->
  <g transform="translate(160, 60)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="40" y="70" font-size="50" font-weight="bold" fill="#764ba2" text-anchor="middle">?</text>
    <circle cx="40" cy="25" r="12" fill="#FFD700"/>
    <text x="40" y="30" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  </g>

  <!-- Card 3 (right) -->
  <g transform="translate(260, 80) rotate(15)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="40" y="70" font-size="50" font-weight="bold" fill="#667eea" text-anchor="middle">?</text>
  </g>

  <!-- Brain with lightbulb icon -->
  <g transform="translate(175, 180)" filter="url(#glow)">
    <ellipse cx="25" cy="30" rx="35" ry="30" fill="#FFD700" opacity="0.3"/>
    <text x="25" y="45" font-size="45" text-anchor="middle">🧠</text>
  </g>

  <!-- Stars decoration -->
  <text x="80" y="200" font-size="20" fill="#FFD700">⭐</text>
  <text x="320" y="180" font-size="25" fill="#FFD700">⭐</text>
  <text x="340" y="100" font-size="15" fill="#FFD700">✨</text>
  <text x="50" y="140" font-size="15" fill="#FFD700">✨</text>

  <!-- Trophy -->
  <text x="310" y="230" font-size="35">🏆</text>

  <!-- Confetti dots -->
  <circle cx="100" cy="250" r="4" fill="#FF6B6B"/>
  <circle cx="130" cy="270" r="3" fill="#4ECDC4"/>
  <circle cx="270" cy="260" r="4" fill="#45B7D1"/>
  <circle cx="290" cy="240" r="3" fill="#96CEB4"/>
</svg>

