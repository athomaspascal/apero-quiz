<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#2C1810"/>

  <!-- Lightning scar -->
  <path d="M 100 40 L 95 60 L 100 60 L 90 85 L 100 70 L 95 70 L 105 45 Z"
        fill="#FFD700" stroke="#FFA500" stroke-width="2"/>

  <!-- Round glasses (left) -->
  <circle cx="75" cy="95" r="18" fill="none" stroke="#333333" stroke-width="3"/>
  <circle cx="75" cy="95" r="16" fill="rgba(255,255,255,0.1)"/>

  <!-- Round glasses (right) -->
  <circle cx="125" cy="95" r="18" fill="none" stroke="#333333" stroke-width="3"/>
  <circle cx="125" cy="95" r="16" fill="rgba(255,255,255,0.1)"/>

  <!-- Bridge of glasses -->
  <line x1="93" y1="95" x2="107" y2="95" stroke="#333333" stroke-width="3"/>

  <!-- Wand -->
  <line x1="140" y1="130" x2="175" y2="165" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
  <circle cx="175" cy="165" r="3" fill="#FFD700"/>

  <!-- Magic sparkles -->
  <circle cx="170" cy="155" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="180" cy="160" r="1.5" fill="#FFD700" opacity="0.6"/>
  <circle cx="165" cy="170" r="2.5" fill="#FFD700" opacity="0.7"/>

  <!-- Gryffindor scarf -->
  <rect x="85" y="120" width="30" height="60" fill="#740001" opacity="0.8"/>
  <rect x="85" y="120" width="30" height="8" fill="#D3A625"/>
  <rect x="85" y="135" width="30" height="8" fill="#D3A625"/>
  <rect x="85" y="150" width="30" height="8" fill="#D3A625"/>
  <rect x="85" y="165" width="30" height="8" fill="#D3A625"/>

  <!-- Hogwarts castle silhouette -->
  <g opacity="0.4">
    <rect x="30" y="160" width="15" height="30" fill="#555"/>
    <polygon points="30,160 37.5,145 45,160" fill="#555"/>
    <rect x="155" y="155" width="15" height="35" fill="#555"/>
    <polygon points="155,155 162.5,140 170,155" fill="#555"/>
  </g>

  <!-- Text -->
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        fill="#FFD700" text-anchor="middle">HARRY POTTER</text>
</svg>

