#server.address=192.168.1.138
# Listen on all network interfaces (permet l'acces via IP et domaine)
server.address=apero-quiz.duckdns.org
#server.port=8089

# ============================================================

# SSL/HTTPS Configuration
# ============================================================
# HTTPS Port (443 standard, 8443 pour dev)
server.port=8443

# SSL Enabled
server.ssl.enabled=true

# Keystore Configuration
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=quiz-app-2025
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=quiz-app

# SSL Protocol
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Force HTTPS
security.require-ssl=true

# Logging Configuration
logging.level.org.atmosphere=warn

# Debug logging for troubleshooting
logging.level.org.springframework.security=INFO
logging.level.com.vaadin.flow.spring.security=INFO
logging.level.com.quizz=INFO
logging.level.com.quizz.core.ui.component.InactivityMonitor=DEBUG
logging.level.org.springframework.web=INFO

# Log file configuration
logging.file.name=logs/application.log
logging.file.path=logs
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Log pattern for file
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log pattern for console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Enable Vaadin dev mode for development
vaadin.frontend.hotdeploy=true
vaadin.productionMode=true

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.quizz

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=update

# ============================================================
# H2 Database Configuration - Server Mode
# ============================================================
# H2 Database JDBC URL in server mode (persistent file-based database)
# AUTO_SERVER=TRUE allows multiple connections from different processes
spring.datasource.url=jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration (optional, for database management)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Configuration
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Facebook OAuth2
spring.security.oauth2.client.registration.facebook.client-id=YOUR_FACEBOOK_CLIENT_ID
spring.security.oauth2.client.registration.facebook.client-secret=YOUR_FACEBOOK_CLIENT_SECRET
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# LinkedIn OAuth2
spring.security.oauth2.client.registration.linkedin.client-id=YOUR_LINKEDIN_CLIENT_ID
spring.security.oauth2.client.registration.linkedin.client-secret=YOUR_LINKEDIN_CLIENT_SECRET
spring.security.oauth2.client.registration.linkedin.scope=openid,profile,email
spring.security.oauth2.client.registration.linkedin.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.client-name=LinkedIn

spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/userinfo
spring.security.oauth2.client.provider.linkedin.user-name-attribute=sub

# ============================================================
# Inactivity Monitor Configuration
# ============================================================
# Time in seconds after which a user is considered inactive (default: 180 = 3 minutes)
app.inactivity.threshold-seconds=180
# Interval in seconds between inactivity checks (default: 10)
app.inactivity.check-interval-seconds=10
# Countdown duration in seconds before forced logout (default: 10)
app.inactivity.countdown-seconds=10
